# Does Zoho accept SMTP from a cloud IP, or only from the office?
#
# Run this by hand: Actions -> "Zoho SMTP reachability probe" -> Run workflow.
#
# WHY IT EXISTS
#
# Render blocks outbound SMTP on 25, 465 and 587, so every send from production
# timed out before it ever reached Zoho. Moving to a host that permits those
# ports is only worth doing if Zoho will then accept the connection — and we
# have evidence it might not: Zoho already answers IP_NOT_ALLOWED to OAuth token
# refreshes from Render's addresses, because the organisation has an IP policy.
#
# Whether that policy also covers SMTP is the open question, and it decides
# whether migrating the backend fixes anything or lands on the same refusal.
# This answers it in about thirty seconds, from a cloud IP, for free.
#
# NO CREDENTIALS ARE USED OR NEEDED.
#
# The trick is to authenticate with a deliberately wrong password and read
# *which way* Zoho says no:
#
#   "535 Authentication Failed"  -> the IP was accepted; Zoho got as far as
#                                   checking the password. SMTP is not covered
#                                   by the IP policy, so migrating would work.
#   an IP / access-denied refusal -> the policy covers SMTP too, and no host
#                                   change helps.
#   a connection timeout          -> this runner blocks the port itself, which
#                                   tells us nothing about Zoho. Try 587.
#
# Delete this file once the question is settled. It is a diagnostic, not part of
# the product.

name: Zoho SMTP reachability probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Where is this runner
        run: |
          echo "Runner public IP: $(curl -s --max-time 10 https://api.ipify.org || echo unknown)"
          echo "Zoho refuses Render's 74.220.52.0/24 and 74.220.60.0/24 for OAuth."
          echo "This is a different cloud, but the question is the same: does an"
          echo "allowlist that excludes clouds also exclude this one?"

      - name: Probe Zoho SMTP
        run: |
          python3 - <<'PY'
          import smtplib, socket, ssl

          # Both ports, because a host may block one and not the other, and
          # because 465 is implicit TLS while 587 upgrades with STARTTLS.
          targets = [("smtp.zoho.in", 465, True), ("smtp.zoho.in", 587, False)]

          for host, port, implicit in targets:
              print(f"\n--- {host}:{port}")
              try:
                  if implicit:
                      s = smtplib.SMTP_SSL(host, port, timeout=20)
                  else:
                      s = smtplib.SMTP(host, port, timeout=20)
                      s.starttls(context=ssl.create_default_context())
                  print(f"  connected, banner: {s.ehlo()[1].decode(errors='ignore').splitlines()[0]}")
              except socket.timeout:
                  print("  TIMEOUT — this runner blocks the port. Says nothing about Zoho.")
                  continue
              except Exception as e:
                  print(f"  could not connect: {type(e).__name__}: {e}")
                  continue

              # Deliberately wrong password. We only care which refusal we get.
              try:
                  s.login("ds09.user@aksiaerospace.com", "not-a-real-password")
                  print("  VERDICT: logged in?! unexpected — stop and investigate")
              except smtplib.SMTPAuthenticationError as e:
                  print(f"  refused with: {e.smtp_code} {e.smtp_error.decode(errors='ignore')}")
                  print("  VERDICT: the IP was ACCEPTED — Zoho got as far as checking")
                  print("           the password. SMTP is not blocked by the IP policy,")
                  print("           so moving to a host with this port open would work.")
              except Exception as e:
                  print(f"  refused with: {type(e).__name__}: {e}")
                  print("  VERDICT: not a password rejection. If it names an IP or")
                  print("           access restriction, the policy covers SMTP too and")
                  print("           migrating will not help.")
              finally:
                  try:
                      s.quit()
                  except Exception:
                      pass
          PY
