<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="AdaptiveHire">
  <!--
    The same mark the app wears in its top bar (`.brand-mark` in index.css):
    a rounded square in the accent colour with a white A.

    Drawn as paths rather than a <text> element on purpose. A favicon is
    rendered by the browser chrome, outside the page, where the font stack the
    stylesheet asks for may not be loaded or even present — text would fall
    back to whatever the platform has and the letter would change shape between
    machines. Paths look the same everywhere.

    Solid accent rather than the auth page's purple gradient: at 16 CSS pixels a
    gradient reads as mud, and this is the mark that appears on every screen
    after sign-in.

    The corner radius is 17/64, matching the 7/26 the top bar uses, so the tab
    icon and the header mark are visibly the same object.
  -->
  <rect width="64" height="64" rx="17" fill="#2f5bea" />
  <!--
    The A, kept deliberately heavy. Thin strokes disappear at tab size, so the
    apex is squared off rather than pointed and the crossbar is nearly as thick
    as the legs.
  -->
  <path
    d="M19.5 47.5 L32 17.5 L44.5 47.5"
    fill="none"
    stroke="#ffffff"
    stroke-width="7.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M24.5 38.5 H39.5"
    fill="none"
    stroke="#ffffff"
    stroke-width="6.5"
    stroke-linecap="round"
  />
</svg>
